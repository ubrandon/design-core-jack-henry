<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas — Design Core</title>
  <script>(function(){try{var t=localStorage.getItem('dc-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="styles/shared.css">
  <link rel="stylesheet" href="styles/ds.css">
  <link rel="stylesheet" href="styles/canvas-space.css">
  <link rel="stylesheet" href="styles/zoom-controls.css">
  <link rel="stylesheet" href="styles/app.css">
  <style>
    .canvas-card-body { overflow: hidden; max-height: none; }
    .export-toast {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; opacity: 0; transition: opacity 0.18s ease;
      pointer-events: none;
    }
    .export-toast.is-visible { opacity: 1; pointer-events: auto; }
    .export-toast__panel {
      background: #1b1b1b; color: #fff;
      padding: 32px 40px; border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      min-width: 320px; max-width: 420px; text-align: center;
      font: 16px/1.4 -apple-system, system-ui, sans-serif;
      transform: scale(0.96); transition: transform 0.18s ease;
    }
    .export-toast.is-visible .export-toast__panel { transform: scale(1); }
    .export-toast__spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.18);
      border-top-color: #fff; border-radius: 50%;
      animation: export-spin 0.8s linear infinite;
    }
    .export-toast__label { font-size: 16px; font-weight: 500; }
    .export-toast--done .export-toast__spinner,
    .export-toast--error .export-toast__spinner { display: none; }
    .export-toast--error .export-toast__panel { background: #6b1d1d; }
    @keyframes export-spin { to { transform: rotate(360deg); } }

    .canvas-space-viewport.placing-text { cursor: crosshair; }
    .canvas-space-viewport.placing-text .canvas-card { cursor: crosshair; }
    .canvas-text-layer { position: absolute; inset: 0; pointer-events: none; }
    .canvas-text {
      position: absolute; pointer-events: auto; cursor: grab;
      font-family: -apple-system, system-ui, sans-serif;
      font-weight: 800; line-height: 1.1; letter-spacing: -0.02em;
      color: rgba(0,0,0,0.82); white-space: pre; max-width: none;
      padding: 4px 6px; border-radius: 8px; border: 1.5px solid transparent;
      user-select: none;
    }
    .canvas-text:hover { background: rgba(0,0,0,0.03); }
    .canvas-text.is-selected { border-color: #4a8cff; background: rgba(74,140,255,0.06); cursor: grab; }
    .dragging-card .canvas-text { cursor: grabbing; }
    .canvas-text-input {
      font-family: inherit; font-weight: inherit; line-height: inherit; letter-spacing: inherit;
      color: inherit; background: transparent; border: none; outline: none; padding: 0; margin: 0;
      box-sizing: content-box; overflow: visible; min-width: 120px; width: 120px;
    }
    .canvas-alignment-guide {
      position: absolute; z-index: 1000; pointer-events: none;
      background: var(--neon-blue, #4a8cff);
      box-shadow: 0 0 0 0.5px rgba(255,255,255,0.75);
    }
  </style>
  <link rel="stylesheet" href="styles/tool-refresh.css">
</head>
<body>

  <div id="viewport" class="canvas-space-viewport">
    <div id="stage" class="canvas-space-stage"></div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn zoom-btn--tidy" onclick="addText()" title="Add a title (T)">Title</button>
    <button class="zoom-btn zoom-btn--tidy" onclick="refreshScreens()" title="Reload screens to see edits">Refresh</button>
    <div class="zoom-controls__zoom-group">
      <button class="zoom-btn" onclick="pz.zoomBy(-0.04)" title="Zoom out">&minus;</button>
      <span id="zoom-label" class="zoom-level">100%</span>
      <button class="zoom-btn" onclick="pz.zoomBy(0.04)" title="Zoom in">+</button>
      <button class="zoom-btn" type="button" onclick="centerOnContent()" title="Center on screens" aria-label="Center on screens">
        <!-- @phosphor-icons/core assets/regular/crosshair.svg (MIT) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232,120h-8.34A96.14,96.14,0,0,0,136,32.34V24a8,8,0,0,0-16,0v8.34A96.14,96.14,0,0,0,32.34,120H24a8,8,0,0,0,0,16h8.34A96.14,96.14,0,0,0,120,223.66V232a8,8,0,0,0,16,0v-8.34A96.14,96.14,0,0,0,223.66,136H232a8,8,0,0,0,0-16Zm-96,87.6V200a8,8,0,0,0-16,0v7.6A80.15,80.15,0,0,1,48.4,136H56a8,8,0,0,0,0-16H48.4A80.15,80.15,0,0,1,120,48.4V56a8,8,0,0,0,16,0V48.4A80.15,80.15,0,0,1,207.6,120H200a8,8,0,0,0,0,16h7.6A80.15,80.15,0,0,1,136,207.6ZM128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152Z"/></svg>
      </button>
    </div>
  </div>

  <script src="scripts/shared.js"></script>
  <script src="scripts/nav.js"></script>
  <script src="scripts/sidenav.js"></script>
  <script src="scripts/canvas-pan-zoom.js"></script>
  <script src="scripts/live-reload.js"></script>
  <script>
    const CARD_GAP = 40;
    const DRAG_THRESHOLD = 5;
    const TITLE_FONT_SIZE = 48;
    const TITLE_FONT_SIZES = [
      { label: "Small", size: 24 },
      { label: "Medium", size: 36 },
      { label: "Large", size: 48 },
      { label: "Extra large", size: 72 },
      { label: "Massive", size: 144 },
    ];
    const DUPLICATE_OFFSET = 64;
    /** Screen-space distance at which matching object edges or centers snap. */
    const ALIGN_SNAP_THRESHOLD = 8;
    const ALIGN_GUIDE_PADDING = 24;

    function roundCanvasPosition(n) {
      return Math.round(Number(n));
    }

    const projectId = getParam("project");
    if (!projectId) {
      try { sessionStorage.setItem("design-core-redirect-hint", "Canvas link was missing a project id."); } catch (_) {}
      window.location.href = "index.html";
    }

    // Paths reported by the live-reload watcher are raw (not URL-encoded), so
    // compare against those with raw strings. Only URL-build sites use this.
    const encProjectId = encodeURIComponent(projectId);
    function screenUrl(file, suffix) {
      return "data/projects/" + encProjectId + "/screens/" + encodeURIComponent(file) + (suffix || "");
    }

    renderNav({
      breadcrumbs: [
        { label: "Projects", href: "index.html" },
        { label: projectId, href: "project.html?id=" + encProjectId, id: "project-link" },
        { label: "Canvas" },
      ],
      fixed: true,
    });

    fetchJSON("data/projects/" + encProjectId + "/project.json")
      .then(data => {
        var link = document.getElementById("project-link");
        if (link) link.textContent = data.name;
        document.title = data.name + " — Canvas — Design Core";
      })
      .catch(() => {});

    const viewport = document.getElementById("viewport");
    const stage = document.getElementById("stage");

    const STORAGE_KEY = "design-core-canvas-" + (projectId || "default");
    let restoreState = null;
    try {
      const s = sessionStorage.getItem(STORAGE_KEY);
      if (s) restoreState = JSON.parse(s);
    } catch (_) {}

    const pz = initPanZoom(viewport, stage, { navHeight: 52, restoreState });

    function savePanZoom() {
      try {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
          panX: pz.panX,
          panY: pz.panY,
          zoom: pz.zoom,
        }));
      } catch (_) {}
    }
    window.addEventListener("pagehide", savePanZoom);

    let screens = [];
    let texts = [];
    let layoutInteractionActive = false;
    let pendingSavePayload = null;
    let saveInFlight = null;

    /* ── Selection state ── */
    const selected = new Set();
    const selectedTexts = new Set();

    function setCanvasSelection(screenIndices, textIndices) {
      selected.clear();
      screenIndices.forEach(i => selected.add(i));
      selectedTexts.clear();
      textIndices.forEach(i => selectedTexts.add(i));
      selectedText = selectedTexts.size ? Math.min(...selectedTexts) : -1;
      applySelectionClasses();
      applyTextSelectionClasses();
      updateSelectionBar();
    }

    function setSelected(indices) {
      setCanvasSelection(indices, []);
    }

    function setAllSelected() {
      setCanvasSelection(
        screens.map((_, i) => i),
        texts.map((_, i) => i),
      );
    }

    function toggleSelected(idx) {
      if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
      applySelectionClasses();
      updateSelectionBar();
    }

    function clearSelection() {
      setCanvasSelection([], []);
    }

    function applySelectionClasses() {
      screens.forEach((_, i) => {
        const card = document.getElementById("card-" + i);
        if (card) card.classList.toggle("is-selected", selected.has(i));
      });
    }

    /* ── Selection toolbar ── */
    let selectionBar = null;

    function updateSelectionBar() {
      const total = selected.size + selectedTexts.size;
      if (total === 0) {
        if (selectionBar) { selectionBar.remove(); selectionBar = null; }
        return;
      }
      if (!selectionBar) {
        selectionBar = document.createElement("div");
        selectionBar.className = "canvas-selection-bar";
        document.body.appendChild(selectionBar);
      }
      const parts = [];
      if (selected.size) parts.push(selected.size === 1 ? "1 screen" : selected.size + " screens");
      if (selectedTexts.size) parts.push(selectedTexts.size === 1 ? "1 title" : selectedTexts.size + " titles");
      const label = parts.join(" + ");
      selectionBar.innerHTML =
        '<span class="canvas-selection-bar-label">' + label + ' selected</span>' +
        '<button class="canvas-selection-bar-btn" onclick="deleteSelected()">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
        'Delete</button>';
    }

    function selectedObjectLabel() {
      const parts = [];
      if (selected.size) parts.push(selected.size === 1 ? "1 screen" : selected.size + " screens");
      if (selectedTexts.size) parts.push(selectedTexts.size === 1 ? "1 title" : selectedTexts.size + " titles");
      return parts.join(" + ") || "selection";
    }

    /* ── Delete selected canvas objects ── */
    function deleteSelected() {
      if (selected.size === 0 && selectedTexts.size === 0) return;
      const screenIndices = Array.from(selected).sort((a, b) => b - a);
      const textIndices = Array.from(selectedTexts).sort((a, b) => b - a);
      const filesToDelete = screenIndices.map(i => screens[i].file);
      screenIndices.forEach(i => screens.splice(i, 1));
      textIndices.forEach(i => texts.splice(i, 1));
      clearSelection();
      renderCards();
      saveCanvas();
      if (!filesToDelete.length) return;
      let failures = 0;
      Promise.all(filesToDelete.map(f =>
        fetch(screenUrl(f), { method: "DELETE" })
          .then(r => { if (!r.ok) failures++; })
          .catch(() => { failures++; }),
      )).then(() => {
        if (failures > 0) {
          showToast(
            failures === 1
              ? "1 screen file could not be deleted on disk"
              : `${failures} screen files could not be deleted on disk`,
          );
        }
      });
    }

    function buildCanvasPayload() {
      const payload = { screens: screens.map(s => {
        const out = { file: s.file, x: Math.round(s.x), y: Math.round(s.y), width: s.width };
        if (s.name && s.name.trim()) out.name = s.name.trim();
        return out;
      }) };
      if (texts.length) {
        payload.texts = texts.map(t => ({ text: t.text, x: Math.round(t.x), y: Math.round(t.y), size: t.size }));
      }
      return payload;
    }

    async function flushCanvasSaveQueue() {
      let saved = true;
      while (pendingSavePayload) {
        const payload = pendingSavePayload;
        pendingSavePayload = null;
        try {
          const response = await fetch("data/projects/" + encProjectId + "/canvas.json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload, null, 2),
            keepalive: true,
          });
          if (!response.ok) throw new Error("Canvas save failed with status " + response.status);
        } catch (err) {
          saved = false;
          console.error(err);
          showToast("Canvas changes could not be saved");
        }
      }
      return saved;
    }

    function saveCanvas() {
      // Keep only the newest waiting snapshot. The active request always finishes
      // first, so an older response can never overwrite a newer canvas state.
      pendingSavePayload = buildCanvasPayload();
      if (!saveInFlight) {
        saveInFlight = flushCanvasSaveQueue().finally(() => {
          saveInFlight = null;
          // A promise callback can enqueue work just as the current flush settles.
          // Start another flush so that snapshot cannot remain stranded.
          if (pendingSavePayload) saveCanvas();
        });
      }
      return saveInFlight;
    }

    async function duplicateScreenFile(file) {
      const resp = await fetch("/api/duplicate-screen", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ projectId, file }),
      });
      let data = {};
      try { data = await resp.json(); } catch (_) {}
      if (!resp.ok || !data.file) {
        throw new Error(data.error || "Could not duplicate screen file.");
      }
      return data.file;
    }

    async function duplicateSelection(options) {
      const opts = options || {};
      const offsetX = opts.offsetX == null ? DUPLICATE_OFFSET : opts.offsetX;
      const offsetY = opts.offsetY == null ? DUPLICATE_OFFSET : opts.offsetY;
      const screenIndices = Array.from(selected).sort((a, b) => a - b).filter(i => screens[i]);
      const textIndices = Array.from(selectedTexts).sort((a, b) => a - b).filter(i => texts[i]);
      if (!screenIndices.length && !textIndices.length) return null;

      const copiedScreens = [];
      try {
        for (const i of screenIndices) {
          const s = screens[i];
          const file = await duplicateScreenFile(s.file);
          copiedScreens.push({
            file,
            x: roundCanvasPosition(s.x + offsetX),
            y: roundCanvasPosition(s.y + offsetY),
            width: s.width,
            name: s.name && s.name.trim() ? s.name.trim() + " Copy" : "",
          });
        }
      } catch (err) {
        console.error(err);
        showToast("Could not copy screen file");
        return null;
      }

      const copiedTexts = textIndices.map(i => ({
        text: texts[i].text,
        x: roundCanvasPosition(texts[i].x + offsetX),
        y: roundCanvasPosition(texts[i].y + offsetY),
        size: texts[i].size,
      }));

      const firstScreenIdx = screens.length;
      const firstTextIdx = texts.length;
      screens.push(...copiedScreens);
      texts.push(...copiedTexts);

      const nextScreens = copiedScreens.map((_, i) => firstScreenIdx + i);
      const nextTexts = copiedTexts.map((_, i) => firstTextIdx + i);
      setCanvasSelection(nextScreens, nextTexts);
      renderCards();
      if (opts.save !== false) saveCanvas();
      return { screens: nextScreens, texts: nextTexts };
    }

    /* ── Keyboard shortcuts ── */
    window.addEventListener("keydown", function (e) {
      const inField = e.target.closest("input, textarea, [contenteditable]");
      if (e.key === "Delete" || e.key === "Backspace") {
        if (!inField && (selected.size > 0 || selectedTexts.size > 0)) {
          e.preventDefault();
          deleteSelected();
        }
      }
      if ((e.key === "t" || e.key === "T") && !inField && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        addText();
      }
      if ((e.key === "a" || e.key === "A") && (e.metaKey || e.ctrlKey)) {
        if (!e.target.closest("input, textarea, [contenteditable]")) {
          e.preventDefault();
          setAllSelected();
        }
      }
      if (e.key === "Escape") {
        closeContextMenu();
        clearSelection();
        clearTextSelection();
        cancelPlaceText();
      }
    });

    /* ── Right-click context menu ── */
    let ctxMenu = null;

    function closeContextMenu() {
      if (ctxMenu) { ctxMenu.remove(); ctxMenu = null; }
      window.removeEventListener("pointerdown", onCtxOutside);
    }

    function onCtxOutside(e) {
      if (ctxMenu && !ctxMenu.contains(e.target)) closeContextMenu();
    }

    function showContextMenu(x, y, items) {
      closeContextMenu();
      ctxMenu = document.createElement("div");
      ctxMenu.className = "canvas-context-menu";
      ctxMenu.setAttribute("role", "menu");
      for (const item of items) {
        if (item.sep) {
          const sep = document.createElement("div");
          sep.className = "canvas-context-menu-sep";
          ctxMenu.appendChild(sep);
          continue;
        }
        if (item.heading) {
          const heading = document.createElement("div");
          heading.className = "canvas-context-menu-heading";
          heading.textContent = item.heading;
          ctxMenu.appendChild(heading);
          continue;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "canvas-context-menu-item" +
          (item.danger ? " canvas-context-menu-item--danger" : "") +
          (item.active ? " is-active" : "");
        btn.setAttribute("role", typeof item.active === "boolean" ? "menuitemradio" : "menuitem");
        if (typeof item.active === "boolean") btn.setAttribute("aria-checked", item.active ? "true" : "false");
        const iconWrap = document.createElement("span");
        iconWrap.className = "canvas-context-menu-icon";
        if (item.icon) iconWrap.innerHTML = item.icon;
        btn.appendChild(iconWrap);
        const labelEl = document.createElement("span");
        labelEl.className = "canvas-context-menu-label";
        labelEl.textContent = item.label;
        btn.appendChild(labelEl);
        if (item.meta) {
          const metaEl = document.createElement("span");
          metaEl.className = "canvas-context-menu-meta";
          metaEl.textContent = item.meta;
          btn.appendChild(metaEl);
        }
        btn.addEventListener("click", () => {
          if (btn.dataset.busy === "1") return;
          if (item.async) {
            const startBusy = (text) => {
              btn.dataset.busy = "1";
              btn.disabled = true;
              iconWrap.innerHTML = SPINNER_SVG;
              if (text) labelEl.textContent = text;
              for (const other of ctxMenu.querySelectorAll(".canvas-context-menu-item")) {
                if (other !== btn) other.disabled = true;
              }
              window.removeEventListener("pointerdown", onCtxOutside);
            };
            const setLabel = (text) => { if (text) labelEl.textContent = text; };
            Promise.resolve(item.action({ startBusy, setLabel }))
              .catch(err => { console.error(err); })
              .finally(() => { closeContextMenu(); });
          } else {
            closeContextMenu();
            item.action();
          }
        });
        ctxMenu.appendChild(btn);
      }
      ctxMenu.style.left = x + "px";
      ctxMenu.style.top = y + "px";
      document.body.appendChild(ctxMenu);

      const rect = ctxMenu.getBoundingClientRect();
      if (rect.right > window.innerWidth) ctxMenu.style.left = (x - rect.width) + "px";
      if (rect.bottom > window.innerHeight) ctxMenu.style.top = (y - rect.height) + "px";

      setTimeout(() => window.addEventListener("pointerdown", onCtxOutside), 0);
    }

    const SPINNER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="canvas-context-menu-spinner"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>';

    const ICON_SELECT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>';
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const ICON_DELETE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
    const ICON_TEXT_SIZE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>';

    let jszipPromise = null;
    function loadJSZip() {
      if (!jszipPromise) {
        jszipPromise = import("https://esm.sh/jszip@3.10.1").then(m => m.default || m);
      }
      return jszipPromise;
    }

    let exportToastEl = null;
    let exportToastTimer = null;
    function showExportToast(message, state) {
      if (!exportToastEl) {
        exportToastEl = document.createElement("div");
        exportToastEl.className = "export-toast";
        exportToastEl.innerHTML = '<div class="export-toast__panel"><span class="export-toast__spinner"></span><span class="export-toast__label"></span></div>';
        document.body.appendChild(exportToastEl);
      }
      clearTimeout(exportToastTimer);
      exportToastEl.classList.remove("export-toast--done", "export-toast--error");
      if (state) exportToastEl.classList.add("export-toast--" + state);
      exportToastEl.querySelector(".export-toast__label").textContent = message;
      requestAnimationFrame(() => exportToastEl.classList.add("is-visible"));
    }
    function hideExportToast(delay) {
      if (!exportToastEl) return;
      exportToastTimer = setTimeout(() => {
        exportToastEl && exportToastEl.classList.remove("is-visible");
      }, delay || 0);
    }

    async function renderScreenToPng(idx) {
      const screen = screens[idx];
      if (!screen) return null;
      const file = "data/projects/" + encProjectId + "/screens/" + screen.file;
      const width = screen.width || 390;
      const url = "/api/render-png?file=" + encodeURIComponent(file) + "&width=" + width + "&scale=2";
      const resp = await fetch(url);
      if (!resp.ok) {
        console.error("render-png failed", resp.status, await resp.text().catch(() => ""));
        return null;
      }
      return await resp.blob();
    }

    function triggerDownload(dataUrl, name) {
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function downloadScreensAsPng(indices) {
      const list = indices.filter(i => screens[i]);
      if (!list.length) return;

      try {
        if (list.length === 1) {
          showExportToast("Rendering screen…");
          const idx = list[0];
          const blob = await renderScreenToPng(idx);
          if (!blob) {
            showExportToast("Couldn't render screen — see console.", "error");
            hideExportToast(2800);
            return;
          }
          const url = URL.createObjectURL(blob);
          triggerDownload(url, screens[idx].file.replace(/\.html$/, "") + ".png");
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showExportToast("Downloaded 1 screen", "done");
          hideExportToast(1600);
          return;
        }

        showExportToast("Rendering 1 of " + list.length + "…");
        const JSZip = await loadJSZip();
        const zip = new JSZip();
        const skipped = [];
        for (let i = 0; i < list.length; i++) {
          const idx = list[i];
          showExportToast("Rendering " + (i + 1) + " of " + list.length + "…");
          const blob = await renderScreenToPng(idx);
          if (!blob) {
            skipped.push(screens[idx].file);
            continue;
          }
          zip.file(screens[idx].file.replace(/\.html$/, "") + ".png", blob);
        }
        showExportToast("Zipping " + (list.length - skipped.length) + " screens…");
        const blob = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(blob);
        const stamp = new Date().toISOString().slice(0, 10);
        triggerDownload(url, "screens-" + stamp + ".zip");
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        const doneCount = list.length - skipped.length;
        const doneMsg = skipped.length
          ? "Downloaded " + doneCount + " — skipped " + skipped.length + " (render failed)"
          : "Downloaded " + doneCount + " screens";
        showExportToast(doneMsg, "done");
        hideExportToast(skipped.length ? 3200 : 1800);
      } catch (err) {
        console.error("Screen export failed", err);
        showExportToast("Couldn't export — see console for details.", "error");
        hideExportToast(3200);
      }
    }

    viewport.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      const textEl = e.target.closest(".canvas-text");
      const card = e.target.closest(".canvas-card");

      if (textEl) {
        const idx = parseInt(textEl.dataset.idx, 10);
        if (isNaN(idx)) return;
        if (!selectedTexts.has(idx)) {
          clearSelection();
          selectText(idx);
        }

        const label = selectedObjectLabel();
        const selectedSizes = new Set(
          Array.from(selectedTexts)
            .map(i => texts[i] && texts[i].size)
            .filter(size => Number.isFinite(size)),
        );
        const sizeItems = TITLE_FONT_SIZES.map(option => ({
          label: option.label,
          meta: option.size + "px",
          icon: ICON_TEXT_SIZE,
          active: selectedSizes.size === 1 && selectedSizes.has(option.size),
          action: () => setSelectedTextSize(option.size),
        }));
        showContextMenu(e.clientX, e.clientY, [
          { label: "Select All", icon: ICON_SELECT, action: setAllSelected },
          { label: "Duplicate " + label, icon: ICON_COPY, async: true, action: ({ startBusy }) => { startBusy("Duplicating…"); return duplicateSelection(); } },
          { sep: true },
          { heading: "Text size" },
          ...sizeItems,
          { sep: true },
          { label: "Delete " + label, icon: ICON_DELETE, danger: true, action: deleteSelected },
        ]);
      } else if (card) {
        const idx = parseInt(card.id.replace("card-", ""), 10);
        if (isNaN(idx)) return;
        if (!selected.has(idx)) setSelected([idx]);

        const count = selected.size;
        const label = selectedTexts.size ? selectedObjectLabel() : (count === 1 ? screenDisplayName(screens[idx]) : count + " screens");
        const downloadLabel = count === 1 ? "Download as PNG" : "Download " + count + " as PNG";
        const duplicateLabel = "Duplicate " + label;
        const items = [
          { label: "Select All", icon: ICON_SELECT, action: setAllSelected },
          { label: duplicateLabel, icon: ICON_COPY, async: true, action: ({ startBusy }) => { startBusy("Duplicating…"); return duplicateSelection(); } },
          { label: downloadLabel, icon: ICON_DOWNLOAD, action: () => downloadScreensAsPng([...selected]) },
          { sep: true },
          { label: "Delete " + label, icon: ICON_DELETE, danger: true, action: deleteSelected },
        ];
        showContextMenu(e.clientX, e.clientY, items);
      } else {
        clearSelection();
        showContextMenu(e.clientX, e.clientY, [
          { label: "Select All", icon: ICON_SELECT, action: setAllSelected },
        ]);
      }
    });

    /* ── Card click/drag + marquee + deselect ── */
    let cardPointer = null;
    let marquee = null;
    let marqueeEl = null;

    function onCardPointerDown(e, idx) {
      if (e.button !== 0) return;
      if (placingText) return;
      if (pz.spaceHeld) return;
      e.stopPropagation();
      e.preventDefault();
      closeContextMenu();

      const shiftHeld = e.shiftKey;

      if (shiftHeld) {
        const next = new Set(selected);
        if (next.has(idx)) next.delete(idx); else next.add(idx);
        setSelected([...next]);
      } else if (!selected.has(idx)) {
        setSelected([idx]);
      }

      cardPointer = {
        idx,
        startX: e.clientX,
        startY: e.clientY,
        lastX: e.clientX,
        lastY: e.clientY,
        moved: false,
        shiftHeld,
        duplicateOnDrag: e.altKey,
        duplicateReady: !e.altKey,
        duplicatePromise: null,
        dragOffsets: null,
        textDragOffsets: null,
        pointerId: e.pointerId,
      };
      layoutInteractionActive = true;
      viewport.setPointerCapture(e.pointerId);
    }

    viewport.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (placingText) {
        e.preventDefault();
        e.stopPropagation();
        placeTextAt(e.clientX, e.clientY);
        return;
      }
      if (pz.spaceHeld) return;
      if (e.target.closest(".canvas-card")) return;

      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        e.stopPropagation();
        marquee = {
          startX: e.clientX,
          startY: e.clientY,
          moved: false,
          pointerId: e.pointerId,
        };
        window.addEventListener("pointermove", onMarqueeWindowPointerMove, true);
        window.addEventListener("pointerup", onMarqueeWindowPointerEnd);
        window.addEventListener("pointercancel", onMarqueeWindowPointerEnd);
      } else {
        closeContextMenu();
        clearSelection();
        clearTextSelection();
      }
    });

    function releaseViewportCaptureSafe(pointerId) {
      try {
        if (pointerId != null && viewport.releasePointerCapture) {
          viewport.releasePointerCapture(pointerId);
        }
      } catch (_) {}
    }

    function stagePointFromClient(clientX, clientY) {
      return pz.clientToStage(clientX, clientY);
    }

    let alignmentGuideEls = [];

    function clearAlignmentGuides() {
      alignmentGuideEls.forEach(el => el.remove());
      alignmentGuideEls = [];
    }

    function normalizedBounds(x, y, width, height) {
      return { minX: x, minY: y, maxX: x + width, maxY: y + height };
    }

    function screenBounds(idx) {
      const s = screens[idx];
      if (!s) return null;
      const card = document.getElementById("card-" + idx);
      const width = s.width || 390;
      const measuredHeight = card ? card.offsetHeight : 0;
      const height = measuredHeight > 0 ? measuredHeight : Math.round(width * 2.16);
      return normalizedBounds(s.x, s.y, width, height);
    }

    function textBounds(idx) {
      const t = texts[idx];
      if (!t) return null;
      const el = textLayer && textLayer.querySelector('.canvas-text[data-idx="' + idx + '"]');
      const width = el && el.offsetWidth ? el.offsetWidth : Math.max(120, singleLineText(t.text).length * t.size * 0.6);
      const height = el && el.offsetHeight ? el.offsetHeight : t.size * 1.1 + 8;
      return normalizedBounds(t.x, t.y, width, height);
    }

    function unionBounds(items) {
      if (!items.length) return null;
      return items.reduce((out, item) => ({
        minX: Math.min(out.minX, item.minX),
        minY: Math.min(out.minY, item.minY),
        maxX: Math.max(out.maxX, item.maxX),
        maxY: Math.max(out.maxY, item.maxY),
      }));
    }

    function movingSelectionBounds() {
      const items = [];
      selected.forEach(i => { const b = screenBounds(i); if (b) items.push(b); });
      selectedTexts.forEach(i => { const b = textBounds(i); if (b) items.push(b); });
      return unionBounds(items);
    }

    function collectAlignmentTargets() {
      const items = [];
      screens.forEach((_, i) => { if (!selected.has(i)) { const b = screenBounds(i); if (b) items.push(b); } });
      texts.forEach((_, i) => { if (!selectedTexts.has(i)) { const b = textBounds(i); if (b) items.push(b); } });
      return items;
    }

    function offsetBounds(bounds, dx, dy) {
      return {
        minX: bounds.minX + dx,
        minY: bounds.minY + dy,
        maxX: bounds.maxX + dx,
        maxY: bounds.maxY + dy,
      };
    }

    function axisValues(bounds, axis) {
      return axis === "x"
        ? [bounds.minX, (bounds.minX + bounds.maxX) / 2, bounds.maxX]
        : [bounds.minY, (bounds.minY + bounds.maxY) / 2, bounds.maxY];
    }

    function bestAxisAlignment(movingBounds, targets, axis) {
      const movingValues = axisValues(movingBounds, axis);
      const threshold = ALIGN_SNAP_THRESHOLD / pz.zoom;
      let best = null;
      targets.forEach(target => {
        const targetValues = axisValues(target, axis);
        for (let i = 0; i < movingValues.length; i++) {
          const delta = targetValues[i] - movingValues[i];
          const distance = Math.abs(delta);
          if (distance <= threshold && (!best || distance < best.distance)) {
            best = { delta, distance, position: targetValues[i], target };
          }
        }
      });
      return best;
    }

    function drawAlignmentGuides(snap, movingBounds) {
      clearAlignmentGuides();
      const thickness = 1 / pz.zoom;
      if (snap.x) {
        const guide = document.createElement("div");
        const top = Math.min(movingBounds.minY, snap.x.target.minY) - ALIGN_GUIDE_PADDING;
        const bottom = Math.max(movingBounds.maxY, snap.x.target.maxY) + ALIGN_GUIDE_PADDING;
        guide.className = "canvas-alignment-guide";
        guide.style.left = snap.x.position + "px";
        guide.style.top = top + "px";
        guide.style.width = thickness + "px";
        guide.style.height = (bottom - top) + "px";
        stage.appendChild(guide);
        alignmentGuideEls.push(guide);
      }
      if (snap.y) {
        const guide = document.createElement("div");
        const left = Math.min(movingBounds.minX, snap.y.target.minX) - ALIGN_GUIDE_PADDING;
        const right = Math.max(movingBounds.maxX, snap.y.target.maxX) + ALIGN_GUIDE_PADDING;
        guide.className = "canvas-alignment-guide";
        guide.style.left = left + "px";
        guide.style.top = snap.y.position + "px";
        guide.style.width = (right - left) + "px";
        guide.style.height = thickness + "px";
        stage.appendChild(guide);
        alignmentGuideEls.push(guide);
      }
    }

    function beginSelectionDrag(pointer) {
      pointer.moved = true;
      viewport.classList.add("dragging-card");
      const start = stagePointFromClient(pointer.startX, pointer.startY);
      clearAlignmentGuides();
      pointer.dragStartStage = start;
      pointer.dragOffsets = [];
      selected.forEach(i => {
        const s = screens[i];
        if (s) pointer.dragOffsets.push({ idx: i, originX: s.x, originY: s.y });
      });
      pointer.textDragOffsets = [];
      selectedTexts.forEach(i => {
        const t = texts[i];
        if (t) pointer.textDragOffsets.push({ idx: i, originX: t.x, originY: t.y });
      });
      pointer.initialSelectionBounds = movingSelectionBounds();
      pointer.alignmentTargets = collectAlignmentTargets();
    }

    function moveSelectionDragToClient(pointer, clientX, clientY, disableSnap) {
      const point = stagePointFromClient(clientX, clientY);
      const rawDx = point.x - pointer.dragStartStage.x;
      const rawDy = point.y - pointer.dragStartStage.y;
      let dx = rawDx;
      let dy = rawDy;
      let snap = { x: null, y: null };
      if (!disableSnap && pointer.initialSelectionBounds && pointer.alignmentTargets.length) {
        const proposed = offsetBounds(pointer.initialSelectionBounds, rawDx, rawDy);
        snap.x = bestAxisAlignment(proposed, pointer.alignmentTargets, "x");
        snap.y = bestAxisAlignment(proposed, pointer.alignmentTargets, "y");
        if (snap.x) dx += snap.x.delta;
        if (snap.y) dy += snap.y.delta;
      }
      pointer.dragOffsets.forEach(d => {
        const s = screens[d.idx];
        if (!s) return;
        s.x = roundCanvasPosition(d.originX + dx);
        s.y = roundCanvasPosition(d.originY + dy);
        const el = document.getElementById("card-" + d.idx);
        if (el) {
          el.style.left = s.x + "px";
          el.style.top = s.y + "px";
        }
      });
      pointer.textDragOffsets.forEach(d => {
        const t = texts[d.idx];
        if (!t) return;
        t.x = roundCanvasPosition(d.originX + dx);
        t.y = roundCanvasPosition(d.originY + dy);
        const el = textLayer && textLayer.querySelector('.canvas-text[data-idx="' + d.idx + '"]');
        if (el) { el.style.left = t.x + "px"; el.style.top = t.y + "px"; }
      });
      if (snap.x || snap.y) {
        drawAlignmentGuides(snap, offsetBounds(pointer.initialSelectionBounds, dx, dy));
      } else {
        clearAlignmentGuides();
      }
    }

    function startAltDuplicateDrag(pointer, isActive) {
      if (pointer.duplicatePromise) return;
      pointer.duplicatePromise = duplicateSelection({ offsetX: 0, offsetY: 0, save: false })
        .then((result) => {
          if (!isActive()) {
            if (result) saveCanvas();
            return;
          }
          if (!result) {
            pointer.duplicateOnDrag = false;
            pointer.duplicateReady = true;
            return;
          }
          pointer.duplicateReady = true;
          beginSelectionDrag(pointer);
          moveSelectionDragToClient(pointer, pointer.lastX, pointer.lastY);
        })
        .catch((err) => {
          console.error(err);
          if (isActive()) {
            pointer.duplicateOnDrag = false;
            pointer.duplicateReady = true;
            showToast("Could not copy selection");
          }
        });
    }

    function endCanvasPointerSession(e) {
      const pid = e.pointerId;
      if (textPointer && textPointer.pointerId === pid) { return endTextPointer(e); }
      if (cardPointer && cardPointer.pointerId === pid) {
        if (cardPointer.moved) {
          viewport.classList.remove("dragging-card");
          clearAlignmentGuides();
          saveCanvas();
        } else if (!cardPointer.shiftHeld) {
          setSelected([cardPointer.idx]);
        }
        cardPointer = null;
        layoutInteractionActive = false;
        releaseViewportCaptureSafe(pid);
        return true;
      }
      if (marquee && marquee.pointerId === pid) {
        return endMarqueePointer(e);
      }
      return false;
    }

    viewport.addEventListener("pointermove", (e) => {
      if (textPointer && e.pointerId === textPointer.pointerId) { onTextPointerMove(e); return; }
      if (cardPointer && e.pointerId === cardPointer.pointerId) {
        cardPointer.lastX = e.clientX;
        cardPointer.lastY = e.clientY;
        const dx = e.clientX - cardPointer.startX;
        const dy = e.clientY - cardPointer.startY;
        if (!cardPointer.moved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;

        if (!cardPointer.moved) {
          if (cardPointer.duplicateOnDrag && !cardPointer.duplicateReady) {
            startAltDuplicateDrag(cardPointer, () => cardPointer && cardPointer.pointerId === e.pointerId);
            return;
          }
          beginSelectionDrag(cardPointer);
        }

        moveSelectionDragToClient(cardPointer, e.clientX, e.clientY, e.metaKey || e.ctrlKey);
        return;
      }

      if (marquee && e.pointerId === marquee.pointerId) { updateMarqueeSelection(e); return; }
    });

    function clearMarqueePointerListeners() {
      window.removeEventListener("pointermove", onMarqueeWindowPointerMove, true);
      window.removeEventListener("pointerup", onMarqueeWindowPointerEnd);
      window.removeEventListener("pointercancel", onMarqueeWindowPointerEnd);
    }

    function onMarqueeWindowPointerMove(e) {
      if (marquee && e.pointerId === marquee.pointerId) {
        updateMarqueeSelection(e);
      }
    }

    function onMarqueeWindowPointerEnd(e) {
      if (marquee && e.pointerId === marquee.pointerId) {
        endMarqueePointer(e);
      }
    }

    function updateMarqueeSelection(e) {
      if (!marquee || e.pointerId !== marquee.pointerId) return false;
      const dx = e.clientX - marquee.startX;
      const dy = e.clientY - marquee.startY;
      if (!marquee.moved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return true;

      if (!marquee.moved) {
        marquee.moved = true;
        pz.isPanning = false;
        marqueeEl = document.createElement("div");
        marqueeEl.className = "canvas-marquee";
        document.body.appendChild(marqueeEl);
      }

      const x = Math.min(marquee.startX, e.clientX);
      const y = Math.min(marquee.startY, e.clientY);
      const w = Math.abs(dx);
      const h = Math.abs(dy);
      marqueeEl.style.left = x + "px";
      marqueeEl.style.top = y + "px";
      marqueeEl.style.width = w + "px";
      marqueeEl.style.height = h + "px";

      const hits = [];
      const textHits = [];
      screens.forEach((s, i) => {
        const card = document.getElementById("card-" + i);
        if (card) {
          const cr = card.getBoundingClientRect();
          if (cr.right > x && cr.left < x + w && cr.bottom > y && cr.top < y + h) {
            hits.push(i);
          }
        }
      });
      if (textLayer) {
        textLayer.querySelectorAll(".canvas-text").forEach((el) => {
          const tr = el.getBoundingClientRect();
          if (tr.right > x && tr.left < x + w && tr.bottom > y && tr.top < y + h) {
            const idx = parseInt(el.dataset.idx, 10);
            if (!isNaN(idx)) textHits.push(idx);
          }
        });
      }
      setCanvasSelection(hits, textHits);
      return true;
    }

    function endMarqueePointer(e) {
      if (!marquee || marquee.pointerId !== e.pointerId) return false;
      if (marquee.moved) updateMarqueeSelection(e);
      if (marqueeEl) { marqueeEl.remove(); marqueeEl = null; }
      marquee = null;
      clearMarqueePointerListeners();
      releaseViewportCaptureSafe(e.pointerId);
      return true;
    }

    viewport.addEventListener("pointerup", (e) => {
      if (endCanvasPointerSession(e)) return;

      if (
        !pz.didPan &&
        !e.target.closest(".canvas-card") &&
        !e.target.closest(".canvas-text") &&
        !e.target.closest(".canvas-context-menu")
      ) {
        clearSelection();
      }
    });

    viewport.addEventListener("pointercancel", (e) => {
      endCanvasPointerSession(e);
    });

    viewport.addEventListener("lostpointercapture", (e) => {
      if (textPointer && textPointer.pointerId === e.pointerId) { endTextPointer(e); return; }
      if (cardPointer && cardPointer.pointerId === e.pointerId) {
        if (cardPointer.moved) {
          viewport.classList.remove("dragging-card");
          clearAlignmentGuides();
          saveCanvas();
        } else if (!cardPointer.shiftHeld) {
          setSelected([cardPointer.idx]);
        }
        cardPointer = null;
        layoutInteractionActive = false;
      }
      if (marquee && marquee.pointerId === e.pointerId) {
        endMarqueePointer(e);
      }
    });

    /* ── Canvas data ── */

    function getScreensBounds() {
      if (!screens.length) return null;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < screens.length; i++) {
        const s = screens[i];
        const w = s.width || 390;
        const card = document.getElementById("card-" + i);
        // Cards start with tiny iframes until the inner doc loads, so fall back
        // to a mobile-ish aspect ratio so initial centering frames the content.
        const measured = card ? card.offsetHeight : 0;
        const h = measured > 200 ? measured : Math.round(w * 2.16);
        if (s.x < minX) minX = s.x;
        if (s.y < minY) minY = s.y;
        if (s.x + w > maxX) maxX = s.x + w;
        if (s.y + h > maxY) maxY = s.y + h;
      }
      return { minX, minY, maxX, maxY };
    }

    /** Frame a bounds rect inside the viewport and apply the pan/zoom. */
    function frameBounds(b, margin) {
      const rect = viewport.getBoundingClientRect();
      const m = margin == null ? 60 : margin;
      const contentW = Math.max(1, b.maxX - b.minX);
      const contentH = Math.max(1, b.maxY - b.minY);
      const zX = (rect.width - m * 2) / contentW;
      const zY = (rect.height - m * 2) / contentH;
      let z = Math.min(zX, zY, 1);
      z = Math.max(0.2, Math.min(2, z));
      const cx = (b.minX + b.maxX) / 2;
      const cy = (b.minY + b.maxY) / 2;
      pz.zoom = z;
      pz.panX = -cx * z;
      pz.panY = -cy * z;
      pz.applyTransform();
    }

    /** Frame all screens inside the viewport. The stage's (0,0) is CSS-positioned
     *  at the viewport center, so panning by (-cx*z, -cy*z) lands the content
     *  center at the viewport center. */
    function centerOnContent() {
      const b = getScreensBounds();
      if (!b) {
        pz.zoom = 1;
        pz.panX = 0;
        pz.panY = 0;
        pz.applyTransform();
        return;
      }
      frameBounds(b, 60);
    }

    /** Frame a single screen by its file name. Returns true if the screen was found. */
    function centerOnScreen(file) {
      const idx = screens.findIndex((s) => s.file === file);
      if (idx < 0) return false;
      const s = screens[idx];
      const w = s.width || 390;
      const card = document.getElementById("card-" + idx);
      const measured = card ? card.offsetHeight : 0;
      const h = measured > 200 ? measured : Math.round(w * 2.16);
      frameBounds({ minX: s.x, minY: s.y, maxX: s.x + w, maxY: s.y + h }, 40);
      return true;
    }

    function loadCanvas(changedFiles, reloadAllScreens) {
      return fetch("data/projects/" + encProjectId + "/canvas.json?t=" + Date.now())
        .then(r => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(data => {
          let autoX = 0;
          const next = data.screens.map((s) => {
            const w = s.width || 390;
            const x = s.x != null ? s.x : autoX;
            const y = s.y != null ? s.y : 0;
            autoX = x + w + CARD_GAP;
            const name = typeof s.name === "string" ? s.name : "";
            return { file: s.file, x, y, width: w, name };
          });
          const nextTexts = Array.isArray(data.texts) ? data.texts.map(t => ({
            text: typeof t.text === "string" ? t.text : "",
            x: t.x != null ? t.x : 0,
            y: t.y != null ? t.y : 0,
            size: t.size || TITLE_FONT_SIZE,
          })) : [];
          const structureSame = screens.length === next.length && next.every((n, i) =>
            screens[i] && n.file === screens[i].file && n.width === screens[i].width && (n.name || "") === (screens[i].name || "")
          );
          const textsSame = texts.length === nextTexts.length && nextTexts.every((n, i) =>
            texts[i] && n.text === texts[i].text && n.x === texts[i].x && n.y === texts[i].y && n.size === texts[i].size
          );
          if (!structureSame) {
            screens = next;
            renderCards();
            var empty = document.getElementById("canvas-empty");
            if (empty) empty.remove();
          } else {
            const positionsChanged = next.some((n, i) => n.x !== screens[i].x || n.y !== screens[i].y);
            if (positionsChanged && !layoutInteractionActive) {
              next.forEach((n, i) => {
                screens[i].x = n.x;
                screens[i].y = n.y;
                const card = document.getElementById("card-" + i);
                if (card) {
                  card.style.left = n.x + "px";
                  card.style.top = n.y + "px";
                }
              });
            }
            if (reloadAllScreens) {
              reloadChangedIframes([], true);
            } else if (changedFiles && changedFiles.length) {
              reloadChangedIframes(changedFiles, false);
            }
          }
          if (!textsSame) {
            texts = nextTexts;
            renderTexts();
          }
        })
        .catch(() => {
          if (!screens.length) {
            stage.innerHTML = "";
            var existing = document.getElementById("canvas-empty");
            if (!existing) {
              var el = document.createElement("div");
              el.id = "canvas-empty";
              el.style.cssText = "position:fixed;inset:0;top:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:10;";
              el.innerHTML = '<div style="font-size:1.1rem;font-weight:800;color:rgba(0,0,0,0.55);margin-bottom:8px;">No screens yet</div><div style="font-size:0.9rem;color:rgba(0,0,0,0.4);line-height:1.55;max-width:340px;">Ask the AI to create screens for this project — describe the UI you want to explore.</div>';
              document.body.appendChild(el);
            }
          }
        });
    }

    function reloadChangedIframes(changedFiles, reloadAll) {
      // Watcher paths are raw (unencoded) — compare raw, then build encoded URL.
      const rawPrefix = "data/projects/" + projectId + "/screens/";
      const bust = "?t=" + Date.now();
      screens.forEach((s, i) => {
        const fullPath = rawPrefix + s.file;
        if (reloadAll || changedFiles.some(f => f === fullPath)) {
          const card = document.getElementById("card-" + i);
          if (!card) return;
          const iframe = card.querySelector("iframe");
          if (iframe) {
            iframe.src = screenUrl(s.file, bust);
          }
        }
      });
    }

    function refreshScreens() {
      screens = [];
      texts = [];
      clearSelection();
      const btn = document.querySelector('[onclick="refreshScreens()"]');
      if (btn) { btn.disabled = true; }
      loadCanvas().then(() => {
        if (btn) {
          btn.textContent = "✓ Refresh";
          btn.disabled = false;
          setTimeout(() => { btn.textContent = "Refresh"; }, 1500);
        }
      });
    }

    // An explicit ?screen=<file> deep-link always wins over the saved session
    // view — otherwise clicking a preview card could land on a different spot.
    const deepLinkScreen = getParam("screen");

    loadCanvas().then(() => {
      const applyInitialFrame = () => {
        if (deepLinkScreen && centerOnScreen(deepLinkScreen)) return;
        if (restoreState) return;
        centerOnContent();
      };

      // First frame uses a fallback height; refine once the iframes report their
      // real size so the initial zoom isn't skewed by the 150px default.
      applyInitialFrame();
      const iframes = stage.querySelectorAll("iframe");
      let pending = iframes.length;
      if (!pending) return;
      let finalized = false;
      const finalize = () => {
        if (finalized) return;
        finalized = true;
        applyInitialFrame();
      };
      iframes.forEach((f) => {
        f.addEventListener("load", () => {
          if (--pending <= 0) finalize();
        }, { once: true });
      });
      // Guard in case some iframes never fire load (e.g. cached errors).
      setTimeout(finalize, 1500);
    });

    /* ── Live reload ── */
    window.__onDataChanged = function(paths) {
      const prefix = "data/projects/" + projectId + "/";
      const relevant = paths.filter(p => p.startsWith(prefix));
      if (!relevant.length && paths.length > 0) return;

      const canvasJsonChanged = relevant.some(p => p === prefix + "canvas.json");
      const screenFiles = relevant.filter(p => p.startsWith(prefix + "screens/"));

      if (canvasJsonChanged || relevant.length === 0) {
        loadCanvas(screenFiles, relevant.length === 0);
      } else if (screenFiles.length) {
        reloadChangedIframes(screenFiles, false);
      }
    };

    function screenDisplayName(s) {
      if (s.name && s.name.trim()) return s.name.trim();
      return (s.file || "").replace(/\.html$/, "");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderCards() {
      const bust = "?t=" + Date.now();
      stage.innerHTML = screens.map((s, i) => `
        <div class="canvas-card${selected.has(i) ? " is-selected" : ""}" id="card-${i}"
             style="left:${s.x}px; top:${s.y}px; width:${s.width}px;">
          <div class="canvas-card-label" data-idx="${i}" title="Double-click to rename">${escapeHtml(screenDisplayName(s))}</div>
          <div class="canvas-card-body">
            <iframe src="${screenUrl(s.file, bust)}"
                    width="${s.width}"
                    sandbox="allow-same-origin"
                    onload="autoSizeIframe(this)"
                    scrolling="no"
                    style="pointer-events:none; border:none; width:${s.width}px; overflow:hidden;"></iframe>
          </div>
        </div>
      `).join("");

      stage.querySelectorAll(".canvas-card").forEach((card, i) => {
        card.addEventListener("pointerdown", (e) => onCardPointerDown(e, i));
      });
      stage.querySelectorAll(".canvas-card-label").forEach((label) => {
        // Block the card's pointerdown so its preventDefault doesn't swallow the
        // double-click and so dragging the title doesn't move the card.
        label.addEventListener("pointerdown", (e) => {
          if (label.querySelector("input")) return;
          e.stopPropagation();
        });
        label.addEventListener("mousedown", (e) => {
          if (label.querySelector("input")) return;
          e.stopPropagation();
        });
        label.addEventListener("click", (e) => e.stopPropagation());
        label.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          e.preventDefault();
          const idx = parseInt(label.dataset.idx, 10);
          if (!isNaN(idx)) startLabelEdit(idx);
        });
      });
      // stage.innerHTML reset above drops the text layer; rebuild it.
      textLayer = null;
      renderTexts();
    }

    function startLabelEdit(idx) {
      const card = document.getElementById("card-" + idx);
      if (!card) return;
      const label = card.querySelector(".canvas-card-label");
      if (!label || label.querySelector("input")) return;
      const current = screenDisplayName(screens[idx]);
      const input = document.createElement("input");
      input.type = "text";
      input.className = "canvas-card-label-input";
      input.value = current;
      label.textContent = "";
      label.appendChild(input);
      input.focus();
      input.select();

      const stop = (e) => e.stopPropagation();
      input.addEventListener("pointerdown", stop);
      input.addEventListener("mousedown", stop);
      input.addEventListener("click", stop);
      input.addEventListener("dblclick", stop);

      let committed = false;
      const commit = () => {
        if (committed) return;
        committed = true;
        const next = input.value.trim();
        const defaultName = (screens[idx].file || "").replace(/\.html$/, "");
        const nameToStore = (!next || next === defaultName) ? "" : next;
        const changed = (screens[idx].name || "") !== nameToStore;
        screens[idx].name = nameToStore;
        label.textContent = screenDisplayName(screens[idx]);
        if (changed) saveCanvas();
      };
      const cancel = () => {
        if (committed) return;
        committed = true;
        label.textContent = current;
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); commit(); input.blur(); }
        else if (e.key === "Escape") { e.preventDefault(); cancel(); input.blur(); }
      });
      input.addEventListener("blur", () => {
        commit();
        window.removeEventListener("pointerdown", onOutside, true);
      });
      // Capture-phase: fires before pan-zoom and card handlers can preventDefault.
      const onOutside = (e) => {
        if (e.target === input || input.contains(e.target)) return;
        commit();
        window.removeEventListener("pointerdown", onOutside, true);
      };
      setTimeout(() => window.addEventListener("pointerdown", onOutside, true), 0);
    }

    /* ── Canvas titles (free-floating text) ── */
    let textLayer = null;
    let selectedText = -1;
    let textPointer = null;

    function ensureTextLayer() {
      if (!textLayer) {
        textLayer = document.createElement("div");
        textLayer.className = "canvas-text-layer";
        stage.appendChild(textLayer);
      }
      return textLayer;
    }

    function selectText(idx) {
      selectedText = idx;
      selectedTexts.clear();
      if (idx >= 0) selectedTexts.add(idx);
      applyTextSelectionClasses();
      updateSelectionBar();
    }

    function applyTextSelectionClasses() {
      if (!textLayer) return;
      textLayer.querySelectorAll(".canvas-text").forEach((el) => {
        el.classList.toggle("is-selected", selectedTexts.has(parseInt(el.dataset.idx, 10)));
      });
    }

    function clearTextSelection() {
      selectedText = -1;
      selectedTexts.clear();
      applyTextSelectionClasses();
      updateSelectionBar();
    }

    function singleLineText(str) {
      return String(str || "").replace(/\s*\n+\s*/g, " ").trim();
    }

    function renderTexts() {
      const layer = ensureTextLayer();
      layer.innerHTML = texts.map((t, i) => `
        <div class="canvas-text${selectedTexts.has(i) ? " is-selected" : ""}" data-idx="${i}"
             style="left:${t.x}px; top:${t.y}px; font-size:${t.size}px;">${escapeHtml(singleLineText(t.text) || "Title")}</div>
      `).join("");
      layer.querySelectorAll(".canvas-text").forEach((el) => {
        const idx = parseInt(el.dataset.idx, 10);
        el.addEventListener("pointerdown", (e) => onTextPointerDown(e, idx));
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (e.detail >= 2) {
            e.preventDefault();
            startTextEdit(idx);
          }
        });
        el.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          e.preventDefault();
          startTextEdit(idx);
        });
      });
    }

    // Arm placement: the next click on the canvas drops the title where you click.
    let placingText = false;
    function addText() {
      placingText = true;
      viewport.classList.add("placing-text");
    }
    function cancelPlaceText() {
      placingText = false;
      viewport.classList.remove("placing-text");
    }
    function placeTextAt(clientX, clientY) {
      const point = stagePointFromClient(clientX, clientY);
      const x = point.x;
      const y = point.y;
      texts.push({ text: "", x: roundCanvasPosition(x), y: roundCanvasPosition(y), size: TITLE_FONT_SIZE });
      cancelPlaceText();
      renderTexts();
      const idx = texts.length - 1;
      selectText(idx);
      startTextEdit(idx);
    }

    function onTextPointerDown(e, idx) {
      if (e.button !== 0) return;
      if (placingText) return;
      if (pz.spaceHeld) return;
      const el = e.currentTarget;
      if (el.querySelector("input, textarea")) return;
      if (e.ctrlKey || e.metaKey) return;
      e.stopPropagation();
      closeContextMenu();
      if (selectedTexts.has(idx)) {
        selectedText = idx;
      } else {
        clearSelection();
        selectText(idx);
      }
      textPointer = {
        idx,
        startX: e.clientX,
        startY: e.clientY,
        lastX: e.clientX,
        lastY: e.clientY,
        moved: false,
        duplicateOnDrag: e.altKey,
        duplicateReady: !e.altKey,
        duplicatePromise: null,
        dragOffsets: null,
        textDragOffsets: null,
        pointerId: e.pointerId,
      };
      layoutInteractionActive = true;
      window.addEventListener("pointermove", onTextWindowPointerMove, true);
      window.addEventListener("pointerup", onTextWindowPointerEnd, true);
      window.addEventListener("pointercancel", onTextWindowPointerEnd, true);
    }

    function clearTextPointerListeners() {
      window.removeEventListener("pointermove", onTextWindowPointerMove, true);
      window.removeEventListener("pointerup", onTextWindowPointerEnd, true);
      window.removeEventListener("pointercancel", onTextWindowPointerEnd, true);
    }

    function onTextWindowPointerMove(e) {
      if (textPointer && e.pointerId === textPointer.pointerId) {
        onTextPointerMove(e);
      }
    }

    function onTextWindowPointerEnd(e) {
      if (textPointer && e.pointerId === textPointer.pointerId) {
        endTextPointer(e);
      }
    }

    function onTextPointerMove(e) {
      if (!textPointer || e.pointerId !== textPointer.pointerId) return false;
      textPointer.lastX = e.clientX;
      textPointer.lastY = e.clientY;
      const dx = e.clientX - textPointer.startX;
      const dy = e.clientY - textPointer.startY;
      if (!textPointer.moved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return true;
      if (!textPointer.moved) {
        if (textPointer.duplicateOnDrag && !textPointer.duplicateReady) {
          startAltDuplicateDrag(textPointer, () => textPointer && textPointer.pointerId === e.pointerId);
          return true;
        }
        beginSelectionDrag(textPointer);
      }
      moveSelectionDragToClient(textPointer, e.clientX, e.clientY, e.metaKey || e.ctrlKey);
      return true;
    }

    function endTextPointer(e) {
      if (!textPointer || textPointer.pointerId !== e.pointerId) return false;
      if (textPointer.moved) {
        viewport.classList.remove("dragging-card");
        clearAlignmentGuides();
        saveCanvas();
      }
      textPointer = null;
      layoutInteractionActive = false;
      clearTextPointerListeners();
      releaseViewportCaptureSafe(e.pointerId);
      return true;
    }

    function startTextEdit(idx) {
      const el = textLayer && textLayer.querySelector('.canvas-text[data-idx="' + idx + '"]');
      if (!el || el.querySelector("input, textarea")) return;
      const current = singleLineText(texts[idx].text);
      const input = document.createElement("input");
      input.type = "text";
      input.className = "canvas-text-input";
      input.value = current;
      input.style.fontSize = texts[idx].size + "px";
      el.textContent = "";
      el.appendChild(input);
      const measure = document.createElement("span");
      measure.style.cssText = "position:absolute;left:-99999px;top:-99999px;visibility:hidden;white-space:pre;font:inherit;letter-spacing:inherit;";
      el.appendChild(measure);
      const autoSize = () => {
        measure.textContent = input.value || input.placeholder || "Title";
        const measured = measure.offsetWidth || (measure.getBoundingClientRect().width / pz.zoom);
        input.style.width = Math.max(120, Math.ceil(measured) + 24) + "px";
      };
      autoSize();
      requestAnimationFrame(() => {
        input.focus();
        const caret = input.value.length;
        input.setSelectionRange(caret, caret);
        autoSize();
      });

      const stop = (e) => e.stopPropagation();
      input.addEventListener("pointerdown", stop);
      input.addEventListener("mousedown", stop);
      input.addEventListener("click", stop);
      input.addEventListener("dblclick", stop);
      input.addEventListener("input", autoSize);

      let committed = false;
      let removeOutsideListeners = () => {};
      const commit = () => {
        if (committed) return;
        committed = true;
        const next = singleLineText(input.value);
        if (!next) {
          texts.splice(idx, 1);
          clearTextSelection();
          renderTexts();
          saveCanvas();
          removeOutsideListeners();
          return;
        }
        const changed = texts[idx].text !== next;
        texts[idx].text = next;
        renderTexts();
        selectText(idx);
        if (changed) saveCanvas();
        removeOutsideListeners();
      };
      const cancel = () => {
        if (committed) return;
        committed = true;
        if (!current) { texts.splice(idx, 1); clearTextSelection(); }
        renderTexts();
        removeOutsideListeners();
      };
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        else if (e.key === "Escape") { e.preventDefault(); cancel(); }
      });
      input.addEventListener("blur", commit);
      const onOutside = (e) => {
        if (e.target === input || input.contains(e.target)) return;
        commit();
      };
      setTimeout(() => {
        if (committed) return;
        window.addEventListener("pointerdown", onOutside, true);
        window.addEventListener("mousedown", onOutside, true);
        removeOutsideListeners = () => {
          window.removeEventListener("pointerdown", onOutside, true);
          window.removeEventListener("mousedown", onOutside, true);
        };
      }, 0);
    }

    function deleteSelectedText() {
      if (selectedTexts.size === 0) return;
      Array.from(selectedTexts).sort((a, b) => b - a).forEach(i => texts.splice(i, 1));
      clearTextSelection();
      renderTexts();
      saveCanvas();
    }

    function setSelectedTextSize(size) {
      if (!TITLE_FONT_SIZES.some(option => option.size === size) || selectedTexts.size === 0) return;
      selectedTexts.forEach(i => {
        if (texts[i]) texts[i].size = size;
      });
      renderTexts();
      saveCanvas();
    }

    function autoSizeIframe(iframe) {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const win = iframe.contentWindow;
        const scrollTop = doc.documentElement.scrollTop || doc.body.scrollTop || 0;
        let max = 0;
        const all = doc.body.getElementsByTagName("*");
        for (let i = 0; i < all.length; i++) {
          const el = all[i];
          if (isClippedByAncestor(el, win)) continue;
          const r = el.getBoundingClientRect();
          const bottom = r.bottom + scrollTop;
          if (bottom > max) max = bottom;
        }
        if (!max) max = doc.documentElement.scrollHeight;
        iframe.style.height = Math.ceil(max) + "px";
      } catch (e) {}
    }

    function isClippedByAncestor(el, win) {
      let p = el.parentElement;
      while (p && p !== el.ownerDocument.body) {
        const ov = win.getComputedStyle(p).overflowY;
        if (ov === "hidden" || ov === "auto" || ov === "scroll") return true;
        p = p.parentElement;
      }
      return false;
    }
  </script>
</body>
</html>
