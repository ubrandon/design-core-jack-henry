<style>
  /* Unsplash bg (free license); swap photo id to change it. */
  html, body { margin: 0; padding: 0; }
  .se-stage { position: relative; width: 390px; min-height: 844px; box-sizing: border-box; font-family: var(--font-body); background: linear-gradient(180deg, rgba(15,25,55,0.32) 0%, rgba(18,38,86,0.55) 100%), url("https://images.unsplash.com/photo-1628348068343-c6a848d2b6dd?auto=format&fit=crop&w=900&h=1500&q=70") center / cover no-repeat; display: flex; align-items: center; justify-content: center; padding: 40px 18px; }
  .se-card { position: relative; width: 100%; box-sizing: border-box; background: #fff; border-radius: 22px; box-shadow: 0 20px 55px rgba(10,20,45,0.35); padding: 30px 26px; overflow: hidden; }
  .se-back { position: absolute; top: 26px; left: 24px; background: none; border: none; padding: 0; cursor: pointer; z-index: 2; }
  .se-logo { display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 24px; }
  .se-logo-word { font-size: 1.95rem; font-weight: 800; color: #16235c; letter-spacing: -0.01em; }
  .se-logo-word b { color: #3a5ca8; font-weight: 700; }
  .se-title { text-align: center; font-size: 1.55rem; font-weight: 700; color: rgba(0,0,0,0.85); margin: 0 0 8px; }
  .se-sub { text-align: center; font-size: 0.98rem; color: rgba(0,0,0,0.62); margin: 0 0 22px; line-height: 1.45; }
  .se-fab { position: absolute; right: 20px; bottom: 86px; width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 4px 14px rgba(0,0,0,0.18); display: grid; place-items: center; color: rgba(0,0,0,0.6); font-size: 1.25rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .se-footer { margin: 28px -26px -30px; background: #14224d; color: rgba(255,255,255,0.85); padding: 15px 20px 18px; text-align: center; font-size: 0.72rem; line-height: 1.7; }
  .se-footer a { color: #7fa8ff; text-decoration: none; }
  .se-footer .se-house { display: inline-block; vertical-align: -2px; margin-right: 4px; }
  .mfield { position: relative; border: 1px solid rgba(0,0,0,0.4); border-radius: 6px; padding: 18px 14px 14px; margin-bottom: 18px; }
  .mfield-label { position: absolute; top: -9px; left: 12px; background: #fff; padding: 0 6px; font-size: 0.8rem; color: rgba(0,0,0,0.6); }
  .mfield-value { font-size: 1.1rem; color: rgba(0,0,0,0.85); }
  .mfield-empty { border: 1px solid rgba(0,0,0,0.4); border-radius: 6px; padding: 19px 14px; margin-bottom: 18px;
    font-size: 1.1rem; color: rgba(0,0,0,0.5); }
  .section { font-size: 1.2rem; font-weight: 700; color: rgba(0,0,0,0.85); margin: 6px 0 6px; }
  .section-line { height: 1px; background: rgba(0,0,0,0.14); margin-bottom: 20px; }
  .next { display: block; margin: 14px auto 8px; padding: 14px 40px; border: none; border-radius: 10px;
    background: #3949d1; color: #fff; font-family: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
</style>
<div class="se-stage">
  <div class="se-card">
    <button class="se-back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="se-logo">

        <circle cx="32" cy="32" r="29"/>
        <path d="M17 27 L32 18 L47 27"/>
        <line x1="16" y1="29" x2="48" y2="29"/>
        <line x1="22" y1="29" x2="22" y2="43"/>
        <line x1="32" y1="29" x2="32" y2="43"/>
        <line x1="42" y1="29" x2="42" y2="43"/>
        <line x1="15" y1="45" x2="49" y2="45"/>
      </svg>
      <span class="se-logo-word">Your<b>FI</b></span>

    <h1 class="se-title">Create your YourFI ID</h1>

    <div class="mfield">

    <div class="mfield">

      Member FDIC &nbsp;&middot;&nbsp;
      <svg class="se-house" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Equal Housing Lender
    </div>
  </div>
</div>
