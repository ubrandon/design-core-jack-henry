<link rel="stylesheet" href="../../../../styles/shared.css">
<link rel="stylesheet" href="../../../../styles/ds.css">
<link rel="stylesheet" href="../../../../data/design-system/company.css">
<style>
  html, body { margin: 0; padding: 0; }
  .nav { background: #0d1b3d; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .nav-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
  .nav-icon-btn { background: none; border: none; color: #fff; padding: 4px; cursor: pointer; display: flex; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg-0); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 8px 0 16px; }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.18); margin: 6px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 4px; }
  .sheet-title { font-size: 1.1rem; font-weight: 700; color: rgba(0,0,0,0.9); }
  .sheet-sub { font-size: 0.8rem; color: rgba(0,0,0,0.5); padding: 0 20px 16px; }
  .clear-link { background: none; border: none; font-size: 0.78rem; font-weight: 700; color: var(--jh-blue); letter-spacing: 0.04em; cursor: pointer; }
  .group-label { font-size: 0.7rem; font-weight: 700; color: rgba(0,0,0,0.5); letter-spacing: 0.08em; padding: 14px 20px 8px; }
  .group { background: var(--bg-1); margin: 0 20px 4px; border-radius: var(--radius-md); padding: 4px 0; }
  .field-stack { display: flex; flex-direction: column; }
  .field-input { width: 100%; padding: 12px 14px; border: none; background: transparent; font-size: 0.92rem; color: rgba(0,0,0,0.85); font-family: inherit; box-sizing: border-box; }
  .field-input::placeholder { color: rgba(0,0,0,0.45); }
  .field-divider { height: 1px; background: rgba(0,0,0,0.06); margin: 0 14px; }
  .check-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
  .check-label { font-size: 0.92rem; font-weight: 500; color: rgba(0,0,0,0.85); }
  .check-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(0,0,0,0.2); }
  .apply { margin: 20px 20px 0; }
  .apply button { width: 100%; padding: 14px; }
</style>
<div style="position: relative; background: var(--bg-1); min-height: 100%; overflow: hidden;">
  <div class="nav">
    <button class="nav-icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <span class="nav-title">Search recipients</span>
    <button class="nav-icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5-5 5 5M7 14l5 5 5-5"/></svg></button>
  </div>
  <div style="height: 200px;"></div>

  <div class="scrim"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span class="sheet-title">More filters</span>
      <button class="clear-link">CLEAR ALL</button>
    </div>
    <div class="sheet-sub">Search by recipient name in the list. These filter the API.</div>

    <div class="group-label">IDENTIFIERS</div>
    <div class="group">
      <div class="field-stack">
        <input class="field-input" placeholder="ID number">
        <div class="field-divider"></div>
        <input class="field-input" placeholder="Batch name">
      </div>
    </div>

    <div class="group-label">AMOUNT</div>
    <div class="group">
      <input class="field-input" placeholder="$ Amount">
    </div>

    <div class="group-label">STATUS</div>
    <div class="group">
      <div class="check-row"><span class="check-label">Prenote</span><div class="check-box"></div></div>
      <div class="field-divider"></div>
      <div class="check-row"><span class="check-label">Held</span><div class="check-box"></div></div>
    </div>

    <div class="apply"><button class="jh-btn-primary">Apply filters</button></div>
  </div>
</div>
