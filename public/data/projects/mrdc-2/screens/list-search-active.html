<style>
  html, body { margin: 0; padding: 0; }
  .nav { background: #0d1b3d; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .nav-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
  .nav-icon-btn { background: none; border: none; color: #fff; padding: 4px; cursor: pointer; display: flex; }
  .search-row { display: flex; gap: 10px; padding: 12px 16px; background: var(--bg-0); align-items: center; }
  .search-field { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--bg-0); border-radius: var(--radius-md); padding: 10px 12px; font-size: 0.92rem; color: rgba(0,0,0,0.9); border: 2px solid var(--jh-blue); }
  .search-field input { flex: 1; border: none; outline: none; font-size: 0.92rem; font-family: inherit; color: rgba(0,0,0,0.9); background: transparent; }
  .clear-x { width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .cancel { background: none; border: none; font-size: 0.92rem; font-weight: 600; color: var(--jh-blue); padding: 0 4px; cursor: pointer; }
  .filter-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .list-header { display: flex; justify-content: space-between; padding: 10px 16px; background: rgba(0,0,0,0.03); font-size: 0.7rem; font-weight: 700; color: rgba(0,0,0,0.55); letter-spacing: 0.06em; }
  .recipient { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.05); }
  .r-icon { width: 22px; flex-shrink: 0; display: flex; }
  .r-name-row { display: flex; align-items: baseline; gap: 6px; }
  .r-name { font-size: 0.92rem; font-weight: 600; color: rgba(0,0,0,0.88); }
  .r-name mark { background: rgba(var(--jh-blue-rgb), 0.18); color: var(--jh-blue); padding: 0 2px; border-radius: 3px; }
  .r-acc { font-size: 0.78rem; color: rgba(0,0,0,0.5); }
  .r-id { font-size: 0.78rem; color: rgba(0,0,0,0.55); margin-top: 2px; }
  .r-amt-col { text-align: right; flex-shrink: 0; }
  .r-amt { font-size: 0.92rem; font-weight: 700; color: #16a34a; }
  .r-type { font-size: 0.78rem; color: rgba(0,0,0,0.5); margin-top: 2px; }
  .recipient-body { flex: 1; }
  .recent-label { font-size: 0.7rem; font-weight: 700; color: rgba(0,0,0,0.5); letter-spacing: 0.08em; padding: 14px 16px 6px; }
  .recent-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; }
  .recent-icon { color: rgba(0,0,0,0.4); display: flex; }
  .recent-name { font-size: 0.92rem; color: rgba(0,0,0,0.85); flex: 1; }
  .recent-arrow { color: rgba(0,0,0,0.3); display: flex; }
</style>
