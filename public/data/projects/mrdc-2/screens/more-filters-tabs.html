<link rel="stylesheet" href="../../../../styles/shared.css">
<link rel="stylesheet" href="../../../../styles/ds.css">
<link rel="stylesheet" href="../../../../data/design-system/company.css">
<style>
  html, body { margin: 0; padding: 0; }
  .nav { background: #0d1b3d; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .nav-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
  .nav-icon-btn { background: none; border: none; color: #fff; padding: 4px; cursor: pointer; display: flex; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg-0); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 8px 0 16px; }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.18); margin: 6px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 16px; }
  .sheet-title { font-size: 1.1rem; font-weight: 700; color: rgba(0,0,0,0.9); }
  .clear-link { background: none; border: none; font-size: 0.78rem; font-weight: 700; color: var(--jh-blue); letter-spacing: 0.04em; cursor: pointer; }
  .tabs { display: flex; padding: 0 20px; border-bottom: 1px solid rgba(0,0,0,0.08); margin-bottom: 16px; }
  .tab { padding: 12px 4px; margin-right: 24px; font-size: 0.9rem; font-weight: 600; color: rgba(0,0,0,0.5); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.is-active { color: var(--jh-blue); border-bottom-color: var(--jh-blue); }
  .tab .count { display: inline-block; min-width: 18px; height: 18px; border-radius: 9px; background: rgba(var(--jh-blue-rgb), 0.15); color: var(--jh-blue); font-size: 0.7rem; font-weight: 700; padding: 0 6px; line-height: 18px; margin-left: 6px; }
  .field { margin: 0 20px 12px; }
  .field-input { width: 100%; padding: 13px 14px; border: 1px solid rgba(0,0,0,0.12); border-radius: var(--radius-md); font-size: 0.92rem; color: rgba(0,0,0,0.55); background: var(--bg-0); box-sizing: border-box; font-family: inherit; }
  .duo { display: flex; gap: 10px; margin: 0 20px 12px; }
  .duo .field-input { flex: 1; }
  .apply { margin: 16px 20px 0; }
  .apply button { width: 100%; padding: 14px; }
</style>
<div style="position: relative; background: var(--bg-1); min-height: 100%; overflow: hidden;">
  <div class="nav">
    <button class="nav-icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <span class="nav-title">Search recipients</span>
    <button class="nav-icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5-5 5 5M7 14l5 5 5-5"/></svg></button>
  </div>
  <div style="height: 200px;"></div>

  <div class="scrim"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span class="sheet-title">More filters</span>
      <button class="clear-link">CLEAR ALL</button>
    </div>

    <div class="tabs">
      <span class="tab is-active">Common <span class="count">1</span></span>
      <span class="tab">Advanced</span>
    </div>

    <div class="field"><input class="field-input" placeholder="ID number" value="123456" style="color: rgba(0,0,0,0.9); font-weight: 600;"></div>
    <div class="duo">
      <input class="field-input" placeholder="Min $">
      <input class="field-input" placeholder="Max $">
    </div>
    <div class="field"><input class="field-input" placeholder="Batch name"></div>

    <div class="apply"><button class="jh-btn-primary">Apply</button></div>
  </div>
</div>
