<style>
  html, body { margin: 0; padding: 0; }
  .nav { background: #0d1b3d; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .nav-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
  .nav-icon-btn { background: none; border: none; color: #fff; padding: 4px; cursor: pointer; display: flex; }
  .search-row { display: flex; gap: 10px; padding: 12px 16px; background: var(--bg-0); }
  .search-field { flex: 1; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.04); border-radius: var(--radius-md); padding: 10px 12px; font-size: 0.9rem; color: rgba(0,0,0,0.5); }
  .filter-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
  .filter-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #dc2626; border: 2px solid var(--bg-0); }
  .list-header { display: flex; justify-content: space-between; padding: 10px 16px; background: rgba(0,0,0,0.03); font-size: 0.7rem; font-weight: 700; color: rgba(0,0,0,0.55); letter-spacing: 0.06em; }
  .recipient { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.05); }
  .r-icon { width: 22px; flex-shrink: 0; display: flex; }
  .r-name-row { display: flex; align-items: baseline; gap: 6px; }
  .r-name { font-size: 0.92rem; font-weight: 600; color: rgba(0,0,0,0.88); }
  .r-acc { font-size: 0.78rem; color: rgba(0,0,0,0.5); }
  .r-id { font-size: 0.78rem; color: rgba(0,0,0,0.55); margin-top: 2px; }
  .r-amt-col { text-align: right; flex-shrink: 0; }
  .r-amt { font-size: 0.92rem; font-weight: 700; color: #16a34a; }
  .r-amt.neutral { color: rgba(0,0,0,0.85); }
  .r-type { font-size: 0.78rem; color: rgba(0,0,0,0.5); margin-top: 2px; }
  .recipient-body { flex: 1; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg-0); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 8px 0 16px; }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.18); margin: 6px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 14px; }
  .sheet-title { font-size: 1.1rem; font-weight: 700; color: rgba(0,0,0,0.9); }
  .clear-link { background: none; border: none; font-size: 0.78rem; font-weight: 700; color: var(--jh-blue); letter-spacing: 0.04em; cursor: pointer; }
  .field { margin: 0 20px 12px; }
  .field-input { width: 100%; padding: 14px 14px; border: 1px solid rgba(0,0,0,0.12); border-radius: var(--radius-md); font-size: 0.92rem; color: rgba(0,0,0,0.55); background: var(--bg-0); box-sizing: border-box; font-family: inherit; }
  .field-input.has-value { color: rgba(0,0,0,0.9); font-weight: 600; }
  .check-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; }
  .check-label { font-size: 0.95rem; font-weight: 500; color: rgba(0,0,0,0.85); }
  .check-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(0,0,0,0.2); }
  .check-box.is-checked { background: var(--jh-blue); border-color: var(--jh-blue); display: flex; align-items: center; justify-content: center; color: #fff; }
  .apply { margin: 16px 20px 0; }
  .apply button { width: 100%; padding: 14px; }
</style>
