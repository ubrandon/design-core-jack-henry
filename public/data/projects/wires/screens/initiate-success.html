<style>
  .yf-app *, .yf-app *::before, .yf-app *::after { box-sizing: border-box; }
  .yf-app {
    --yf-page:#e8ecf1; --yf-white:#fff; --yf-navy-deep:#00264d;
    --yf-blue:#2563eb; --yf-blue-active:#0a4a7a; --yf-nav-active-bg:#e8f0fa;
    --yf-text:#0f172a; --yf-muted:#64748b; --yf-border:#e2e8f0; --yf-green:#16a34a;
    --yf-rad-lg:20px; --yf-rad-md:14px; --yf-rad-sm:10px; --yf-sidebar:236px;
    --yf-font:"Open Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    position:relative; display:flex; height:880px;
    font-family:var(--yf-font); color:var(--yf-text); background:var(--yf-page);
    -webkit-font-smoothing:antialiased;
  }
  /* Sidebar */
  .yf-sidebar { width:var(--yf-sidebar); flex-shrink:0; background:var(--yf-white); border-right:1px solid var(--yf-border); display:flex; flex-direction:column; padding:20px 0 0; }
  .yf-logo { display:flex; align-items:center; gap:10px; padding:0 20px 22px; font-size:1.32rem; font-weight:800; letter-spacing:-0.02em; }
  .yf-logo b { color:var(--yf-navy-deep); } .yf-logo i { color:var(--yf-blue); font-style:normal; }
  .yf-logo__mark { width:34px; height:34px; border-radius:50%; border:2px solid var(--yf-blue); display:grid; place-items:center; color:var(--yf-blue); flex-shrink:0; }
  .yf-nav { list-style:none; margin:0; padding:0 12px; flex:1; overflow-y:auto; }
  .yf-nav > li { margin-bottom:2px; }
  .yf-nav button { width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; border:none; border-radius:var(--yf-rad-sm); background:transparent; font-size:0.875rem; font-weight:600; color:#475569; cursor:pointer; text-align:left; font-family:inherit; }
  .yf-nav button:hover { background:#f8fafc; color:var(--yf-text); }
  .yf-nav__icon { width:20px; height:20px; flex-shrink:0; opacity:0.85; }
  .yf-badge { margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:#dc2626; color:#fff; font-size:0.625rem; font-weight:800; display:grid; place-items:center; }
  .yf-nav__chev { margin-left:auto; opacity:0.45; width:15px; height:15px; flex-shrink:0; }
  .yf-subnav { list-style:none; margin:2px 0 4px; padding:0; }
  .yf-subnav button { padding:9px 12px 9px 44px; font-size:0.84rem; }
  .yf-subnav button.is-active { background:var(--yf-nav-active-bg); color:var(--yf-navy-deep); font-weight:700; }
  .yf-profile { margin-top:auto; padding:16px 20px; border-top:1px solid var(--yf-border); display:flex; align-items:center; gap:10px; font-size:0.875rem; font-weight:700; }
  .yf-avatar { width:36px; height:36px; border-radius:50%; flex-shrink:0; object-fit:cover; background:linear-gradient(135deg,#93c5fd,#3b82f6); }
  .yf-profile__chev { margin-left:auto; opacity:0.4; }
  /* Main + hero */
  .yf-main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  .yf-scroll { flex:1; min-height:0; overflow-y:auto; }
  .yf-hero-band { height:230px; background-color:#042042; background-image:linear-gradient(105deg,rgba(0,38,77,0.92) 0%,rgba(0,55,105,0.72) 45%,rgba(12,90,150,0.5) 100%),url("hero-bg.jpg"); background-size:cover; background-position:72% 30%; }
  .yf-card-wrap { width:100%; max-width:520px; margin:-140px auto 28px; padding:0 20px; }
  /* Card shell */
  .yf-flow-card { background:var(--yf-white); border-radius:var(--yf-rad-md); box-shadow:0 8px 40px rgba(15,40,70,0.14); border:1px solid var(--yf-border); }
  /* Success */
  .yf-done { padding:36px 30px 8px; text-align:center; }
  .yf-done-ico { width:84px; height:84px; margin:0 auto 16px; color:var(--yf-green); }
  .yf-done-ico svg { width:84px; height:84px; display:block; }
  .yf-done-title { font-size:1.4rem; font-weight:800; margin:0 0 20px; }
  .yf-done-sep { border:none; border-top:1px dotted #cbd5e1; margin:0 0 18px; }
  .yf-done-name { font-size:1rem; font-weight:700; margin:0 0 4px; }
  .yf-done-amt { font-size:2.1rem; font-weight:800; letter-spacing:-0.02em; margin:0 0 18px; }
  .yf-done-sched { display:flex; align-items:center; gap:12px; text-align:left; margin:0 0 18px; }
  .yf-done-sched svg { color:var(--yf-muted); flex-shrink:0; }
  .yf-done-sched .lbl { display:block; font-size:0.78rem; color:var(--yf-muted); font-weight:600; }
  .yf-done-sched .val { display:block; font-size:0.95rem; font-weight:700; }
  .yf-done-detail { text-align:left; }
  .yf-done-detail .yf-kv { display:flex; justify-content:space-between; gap:16px; padding:10px 0; }
  .yf-done-detail .k { color:var(--yf-muted); font-weight:600; font-size:0.9rem; }
  .yf-done-detail .v { font-weight:700; font-size:0.9rem; text-align:right; color:var(--yf-text); }
  .yf-done-detail .kv-grand .k, .yf-done-detail .kv-grand .v { font-weight:800; font-size:0.98rem; }
  .yf-dotted { border:none; border-top:1px dotted #cbd5e1; margin:8px 0 6px; }
  .yf-done-actions { padding:18px 24px 28px; display:flex; justify-content:center; }
  .yf-btn { padding:13px 28px; border-radius:var(--yf-rad-md); font-size:0.95rem; font-weight:700; cursor:pointer; font-family:inherit; border:none; }
  .yf-btn--primary { background:var(--yf-blue); color:#fff; min-width:200px; }
  .yf-btn--primary:hover { background:var(--yf-blue-active); }
  /* Footer + help */
  .yf-footer { flex-shrink:0; background:var(--yf-navy-deep); color:rgba(255,255,255,0.8); font-size:0.6875rem; padding:13px 24px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:center; }
  .yf-footer a { color:rgba(255,255,255,0.92); text-decoration:none; }
  .yf-fab { position:absolute; bottom:22px; right:26px; width:46px; height:46px; border-radius:50%; border:none; background:#fff; color:var(--yf-blue); font-size:1.15rem; font-weight:700; cursor:pointer; box-shadow:0 6px 22px rgba(0,0,0,0.18); }
</style>
