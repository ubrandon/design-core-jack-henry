<link rel="stylesheet" href="../../../../styles/shared.css">
<link rel="stylesheet" href="../../../../styles/ds.css">
<link rel="stylesheet" href="../../../../data/design-system/company.css">
<style>
  .dc-screen {
    --acc: #c2410c;
    --acc-bright: #ea580c;
    --acc-soft: rgba(194, 65, 12, 0.10);
    background: var(--bg-0);
    color: rgba(0, 0, 0, 0.88);
    font-family: var(--font-body);
  }
  .dc-statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 18px 4px; font-size: 0.72rem; font-weight: 700;
    color: rgba(0, 0, 0, 0.85);
  }
  .dc-statusbar .dc-status-icons { display: flex; align-items: center; gap: 6px; }
  .dc-appbar {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 16px 14px;
  }
  .dc-appbar svg { color: var(--acc); }
  .dc-appbar-title { font-size: 1.15rem; font-weight: 700; color: rgba(0, 0, 0, 0.9); }
  .dc-body { padding: 0 18px; }

  .dc-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 18px 0; border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }
  .dc-row-label { font-size: 0.95rem; font-weight: 700; color: rgba(0, 0, 0, 0.85); }

  .dc-amount-box {
    display: flex; align-items: center; gap: 8px;
    min-width: 190px; padding: 12px 16px;
    background: var(--bg-1); border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: var(--radius-sm);
  }
  .dc-amount-prefix { font-size: 1rem; font-weight: 600; color: rgba(0, 0, 0, 0.4); }
  .dc-amount-val { flex: 1; text-align: right; font-size: 1.05rem; font-weight: 700; color: var(--acc); }

  .dc-link { font-size: 0.95rem; font-weight: 700; color: var(--acc); text-align: right; }

  .dc-cap-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 0; border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }
  .dc-cap-side { display: flex; flex-direction: column; gap: 8px; color: rgba(0, 0, 0, 0.8); }
  .dc-cap-side svg { color: rgba(0, 0, 0, 0.55); }
  .dc-cap-label { font-size: 0.95rem; font-weight: 700; color: rgba(0, 0, 0, 0.85); }

  .dc-thumb {
    position: relative; width: 140px; height: 94px; flex-shrink: 0;
    border: 2px solid var(--acc); border-radius: 6px; overflow: hidden;
    background: #eef0f3;
  }
  .dc-check {
    position: absolute; inset: 0; padding: 8px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .dc-check-line { height: 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.12); }
  .dc-check-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
  .dc-check-box { width: 34px; height: 16px; border: 1px solid rgba(0, 0, 0, 0.22); border-radius: 2px; }
  .dc-check-micr {
    font-family: monospace; font-size: 0.4rem; letter-spacing: 1px;
    color: rgba(0, 0, 0, 0.38);
  }
  .dc-edit {
    position: absolute; right: 4px; bottom: 4px;
    width: 22px; height: 22px; border-radius: 5px;
    background: var(--acc); color: #fff;
    display: grid; place-items: center;
  }

  .dc-submit-wrap { display: flex; justify-content: center; padding: 30px 0 8px; }
  .dc-submit {
    width: 60%; padding: 14px; border: none; border-radius: var(--radius-sm);
    background: var(--acc); color: #fff; font-family: inherit;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }

  .dc-gesturebar { display: flex; justify-content: center; padding: 14px 0 10px; }
  .dc-gesture { width: 130px; height: 4px; border-radius: 999px; background: rgba(0, 0, 0, 0.35); }
</style>

<div class="dc-screen">

      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M2 9l10-6 10 6-10 13z" opacity="0.85"/></svg>

  <div class="dc-appbar">

      <div class="dc-thumb">

        </div>
        <div class="dc-edit">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>

    </div>

    <div class="dc-submit-wrap">

    </div>
  </div>

  <div class="dc-gesturebar"><span class="dc-gesture"></span></div>
</div>
