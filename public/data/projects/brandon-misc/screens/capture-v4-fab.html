<link rel="stylesheet" href="../../../../styles/shared.css">
<link rel="stylesheet" href="../../../../styles/ds.css">
<link rel="stylesheet" href="../../../../data/design-system/company.css">
<style>
  .vc-wrap { --acc: #c2410c; background: var(--bg-0); color: rgba(0,0,0,0.88); font-family: var(--font-body); padding: 16px 18px 20px; }
  .vc-head { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.08); }
  .vc-badge { width: 24px; height: 24px; flex-shrink: 0; border-radius: 6px; background: rgba(194,65,12,0.12); color: var(--acc); display: grid; place-items: center; font-weight: 800; font-size: 0.8rem; }
  .vc-name { font-size: 0.9rem; font-weight: 800; color: rgba(0,0,0,0.88); }
  .vc-note { font-size: 0.72rem; color: rgba(0,0,0,0.55); line-height: 1.4; margin-top: 2px; }
  .vc-cap-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.08); }
  .vc-cap-row:last-child { border-bottom: none; }
  .vc-cap-side { display: flex; flex-direction: column; gap: 8px; }
  .vc-cap-side svg { color: rgba(0,0,0,0.55); }
  .vc-cap-label { font-size: 0.95rem; font-weight: 700; color: rgba(0,0,0,0.85); }
  .vc-thumb { position: relative; width: 140px; height: 94px; flex-shrink: 0; border: 2px solid var(--acc); border-radius: 6px; background: #eef0f3; }
  .vc-check { position: absolute; inset: 0; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; border-radius: 4px; }
  .vc-line { height: 4px; border-radius: 2px; background: rgba(0,0,0,0.12); }
  .vc-check-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
  .vc-box { width: 34px; height: 16px; border: 1px solid rgba(0,0,0,0.22); border-radius: 2px; }
  .vc-micr { font-family: monospace; font-size: 0.4rem; letter-spacing: 1px; color: rgba(0,0,0,0.38); }
  /* Treatment: raised round edit button overlapping corner (edit-icon lever) */
  .vc-fab { position: absolute; right: -7px; bottom: -7px; width: 32px; height: 32px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.35); border: 2px solid var(--bg-0); }
</style>

<div class="vc-wrap">
  <div class="vc-head">
    <span class="vc-badge">D</span>
    <div>
      <div class="vc-name">Raised edit button</div>
      <div class="vc-note">Enlarges the icon into a round button that lifts off the corner, so it clearly looks pressable.</div>
    </div>
  </div>

  <div class="vc-cap-row">
    <div class="vc-cap-side">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span class="vc-cap-label">Front</span>
    </div>
    <div class="vc-thumb">
      <div class="vc-check">
        <div class="vc-line" style="width:55%;"></div>
        <div class="vc-line" style="width:80%;"></div>
        <div class="vc-check-row"><div class="vc-line" style="width:45px;"></div><div class="vc-box"></div></div>
        <div class="vc-micr">&#9286;000123&#9286; 0007&#9288; 5555</div>
      </div>
      <div class="vc-fab">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </div>
    </div>
  </div>

  <div class="vc-cap-row">
    <div class="vc-cap-side">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span class="vc-cap-label">Back</span>
    </div>
    <div class="vc-thumb">
      <div class="vc-check">
        <div class="vc-line" style="width:70%;"></div>
        <div class="vc-line" style="width:50%;"></div>
        <div class="vc-line" style="width:62%;"></div>
        <div class="vc-micr">FOR MOBILE DEPOSIT ONLY</div>
      </div>
      <div class="vc-fab">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </div>
    </div>
  </div>
</div>
