<style>
  html, body { margin: 0; padding: 0; background: #f8faff; font-family: 'Roboto', -apple-system, sans-serif; }
  .screen { width: 360px; min-height: 900px; background: #f8faff; position: relative; }

  .top-app-bar { padding: 8px 4px; display: flex; align-items: center; gap: 4px; height: 64px; }
  .icon-btn { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; color: #1a1f2e; }
  .top-title { font-size: 1.375rem; font-weight: 400; color: #1a1f2e; }

  .hero { padding: 40px 24px 32px; text-align: center; }
  .hero-icon-wrap { width: 96px; height: 96px; border-radius: 50%; background: #d8f5dc; margin: 0 auto 24px; display: grid; place-items: center; }
  .hero-icon { width: 56px; height: 56px; color: #0a6b1d; }
  .hero-title { font-size: 1.75rem; color: #1a1f2e; font-weight: 400; margin-bottom: 8px; line-height: 1.2; }
  .hero-text { font-size: 0.95rem; color: #475569; line-height: 1.4; }

  .summary { background: #fff; border-radius: 16px; margin: 8px 16px 16px; padding: 4px 0; }
  .row { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
  .row + .row { border-top: 1px solid #e3e8f0; }
  .row-label { font-size: 0.875rem; color: #475569; }
  .row-value { font-size: 0.95rem; color: #1a1f2e; font-weight: 500; text-align: right; }
  .row-value .sub { font-size: 0.78rem; color: #475569; font-weight: 400; margin-top: 2px; display: block; }

  .conf-row { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .conf-label { font-size: 0.875rem; color: #475569; }
  .conf-value { font-family: 'Roboto Mono', monospace; font-size: 0.95rem; color: #1a1f2e; font-weight: 500; letter-spacing: 0.04em; }

  .actions { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .filled-btn { background: #2563eb; color: #fff; padding: 14px; border-radius: 100px; font-weight: 500; font-size: 0.95rem; text-align: center; box-shadow: 0 2px 4px rgba(37,99,235,0.25); }
  .outlined-btn { background: transparent; color: #2563eb; padding: 13px; border-radius: 100px; border: 1px solid #6b7280; font-weight: 500; font-size: 0.95rem; text-align: center; }

  .chip-row { display: flex; justify-content: center; padding: 0 16px 12px; }
  .chip { background: #d8f5dc; color: #0a6b1d; padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
</style>
<div class="screen">
  <div class="top-app-bar">
    <div class="icon-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </div>
    <span class="top-title">Bill pay</span>
  </div>

  <div class="hero">
    <div class="hero-icon-wrap">
      <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>
    <div class="hero-title">Payment submitted</div>
    <div class="hero-text">Your payment to AT&T (x1234) has been submitted.</div>
  </div>

  <div class="chip-row">
    <span class="chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      Processing
    </span>
  </div>

  <div class="summary">
    <div class="row">
      <span class="row-label">Amount</span>
      <span class="row-value">$35.00</span>
    </div>
    <div class="row">
      <span class="row-label">To</span>
      <span class="row-value">AT&T<span class="sub">x1234</span></span>
    </div>
    <div class="row">
      <span class="row-label">From</span>
      <span class="row-value">Checking<span class="sub">x1234</span></span>
    </div>
    <div class="row">
      <span class="row-label">Arrives by</span>
      <span class="row-value">Apr 14</span>
    </div>
    <div class="conf-row">
      <span class="conf-label">Confirmation</span>
      <span class="conf-value">PR-8472-3091</span>
    </div>
  </div>

  <div class="actions">
    <span class="filled-btn">Done</span>
    <span class="outlined-btn">Make another payment</span>
  </div>
</div>
