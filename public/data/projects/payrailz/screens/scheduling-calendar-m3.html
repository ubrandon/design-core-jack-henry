<style>
  html, body { margin: 0; padding: 0; background: #f8faff; font-family: 'Roboto', -apple-system, sans-serif; }
  .screen { width: 360px; min-height: 800px; background: #f8faff; position: relative; }

  .top-app-bar { padding: 8px 4px; display: flex; align-items: center; gap: 4px; height: 64px; }
  .icon-btn { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; color: #1a1f2e; }
  .top-title { font-size: 1.375rem; font-weight: 400; color: #1a1f2e; }

  .form { padding: 8px 16px; opacity: 0.5; pointer-events: none; }
  .m3-field { background: #e3e8f0; border-radius: 4px 4px 0 0; border-bottom: 1px solid #475569; padding: 8px 16px; margin-bottom: 12px; }
  .m3-field-label { font-size: 0.75rem; color: #475569; padding-top: 4px; }
  .m3-field-value { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 1rem; color: #1a1f2e; }

  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.32); }

  .picker { position: absolute; left: 16px; right: 16px; top: 80px; background: #fff; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); overflow: hidden; }
  .picker-head { padding: 18px 24px 12px; }
  .picker-hint { font-size: 0.75rem; color: #2563eb; font-weight: 500; }
  .picker-headline { font-size: 1.75rem; color: #1a1f2e; font-weight: 400; margin-top: 4px; }
  .picker-divider { height: 1px; background: #e3e8f0; }
  .picker-body { padding: 12px 12px 4px; }
  .month-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; }
  .month-title { font-size: 0.95rem; font-weight: 500; color: #1a1f2e; }
  .month-nav { display: flex; gap: 4px; }
  .nav-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #475569; }
  .day-names { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 4px; }
  .day-names span { text-align: center; font-size: 0.75rem; color: #475569; font-weight: 500; padding: 6px 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 4px 4px 12px; }
  .day { aspect-ratio: 1; display: grid; place-items: center; font-size: 0.85rem; color: #1a1f2e; border-radius: 50%; }
  .day.muted { color: #94a3b8; }
  .day.is-today { border: 1px solid #2563eb; color: #2563eb; font-weight: 500; }
  .day.is-selected { background: #2563eb; color: #fff; font-weight: 500; }

  .picker-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 16px 16px; }
  .text-btn { color: #2563eb; padding: 10px 12px; font-weight: 500; font-size: 0.875rem; border-radius: 20px; }
  .filled-btn { background: #2563eb; color: #fff; padding: 10px 24px; border-radius: 100px; font-weight: 500; font-size: 0.95rem; }
</style>
<div class="screen">
  <div class="top-app-bar">
    <div class="icon-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
    <span class="top-title">Scheduling</span>
  </div>

  <div class="form">
    <div class="m3-field">
      <div class="m3-field-label">Frequency</div>
      <div class="m3-field-value">One-time <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></div>
    </div>
    <div class="m3-field">
      <div class="m3-field-label">Send on</div>
      <div class="m3-field-value">Dec 12, 2024 <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg></div>
    </div>
  </div>

  <div class="scrim"></div>

  <div class="picker">
    <div class="picker-head">
      <div class="picker-hint">Select send date</div>
      <div class="picker-headline">Mon, Dec 9</div>
    </div>
    <div class="picker-divider"></div>
    <div class="picker-body">
      <div class="month-row">
        <span class="month-title">December 2024</span>
        <span class="month-nav">
          <span class="nav-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg></span>
          <span class="nav-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></span>
        </span>
      </div>
      <div class="day-names">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="grid">
        <span class="day muted">1</span><span class="day">2</span><span class="day">3</span><span class="day">4</span><span class="day">5</span><span class="day">6</span><span class="day">7</span>
        <span class="day">8</span><span class="day is-selected">9</span><span class="day">10</span><span class="day">11</span><span class="day is-today">12</span><span class="day">13</span><span class="day">14</span>
        <span class="day">15</span><span class="day">16</span><span class="day">17</span><span class="day">18</span><span class="day">19</span><span class="day">20</span><span class="day">21</span>
        <span class="day">22</span><span class="day">23</span><span class="day">24</span><span class="day">25</span><span class="day">26</span><span class="day">27</span><span class="day">28</span>
        <span class="day">29</span><span class="day">30</span><span class="day">31</span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="picker-divider"></div>
    <div class="picker-actions">
      <span class="text-btn">Cancel</span>
      <span class="filled-btn">OK</span>
    </div>
  </div>
</div>
