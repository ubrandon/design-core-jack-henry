<style>
  html, body { margin: 0; padding: 0; background: #f8faff; font-family: 'Roboto', -apple-system, sans-serif; }
  .screen { width: 360px; min-height: 900px; background: #f8faff; }

  .top-app-bar { padding: 8px 4px; display: flex; align-items: center; gap: 4px; height: 64px; }
  .icon-btn { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; color: #1a1f2e; }
  .top-title { font-size: 1.375rem; font-weight: 400; color: #1a1f2e; }

  .amount-block { background: #dbe7ff; margin: 0 16px 16px; border-radius: 16px; padding: 24px 20px; }
  .amount-label { font-size: 0.75rem; color: #0a2a6b; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
  .amount-value { font-size: 3rem; font-weight: 400; color: #0a2a6b; line-height: 1; }
  .amount-sub { font-size: 0.9rem; color: #1a1f2e; margin-top: 12px; font-weight: 500; }
  .amount-sub2 { font-size: 0.85rem; color: #475569; margin-top: 2px; }

  .card { background: #fff; border-radius: 16px; margin: 0 16px 16px; padding: 4px 0; }
  .list-item { padding: 12px 16px; display: flex; align-items: center; gap: 16px; min-height: 56px; }
  .list-item + .list-item { border-top: 1px solid #e3e8f0; }
  .li-leading { width: 24px; height: 24px; color: #475569; flex-shrink: 0; }
  .li-body { flex: 1; min-width: 0; }
  .li-headline { font-size: 0.95rem; color: #1a1f2e; font-weight: 500; }
  .li-support { font-size: 0.8rem; color: #475569; margin-top: 2px; }
  .li-trailing { font-size: 0.95rem; color: #1a1f2e; font-weight: 500; }

  .total-row { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; background: #eef2fa; border-top: 1px solid #e3e8f0; border-radius: 0 0 16px 16px; }
  .total-l { font-size: 0.95rem; font-weight: 500; color: #1a1f2e; }
  .total-r { font-size: 1.05rem; font-weight: 600; color: #0a2a6b; }

  .section-title { font-size: 0.875rem; font-weight: 500; color: #475569; padding: 4px 24px 8px; text-transform: uppercase; letter-spacing: 0.05em; }

  .btn-row { display: flex; justify-content: center; padding: 24px 16px 16px; }
  .filled-btn { background: #2563eb; color: #fff; padding: 12px 36px; border-radius: 100px; font-weight: 500; font-size: 0.95rem; box-shadow: 0 2px 4px rgba(37,99,235,0.25); }
  .text-btn { color: #2563eb; padding: 10px 16px; font-weight: 500; font-size: 0.875rem; text-align: center; }
</style>
<div class="screen">
  <div class="top-app-bar">
    <div class="icon-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
    <span class="top-title">Review payment</span>
  </div>

  <div class="amount-block">
    <div class="amount-label">Total</div>
    <div class="amount-value">$35.00</div>
    <div class="amount-sub">Pay AT&T · x1234</div>
    <div class="amount-sub2">From Checking · x1234</div>
  </div>

  <div class="section-title">Payment method</div>
  <div class="card">
    <div class="list-item">
      <span class="li-leading">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z"/></svg>
      </span>
      <div class="li-body">
        <div class="li-headline">Expedited check</div>
        <div class="li-support">Next business day</div>
      </div>
      <span class="li-trailing">$25.00</span>
    </div>
    <div class="list-item">
      <span class="li-leading">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
      </span>
      <div class="li-body">
        <div class="li-headline">Service fee</div>
        <div class="li-support">Standard processing</div>
      </div>
      <span class="li-trailing">$10.00</span>
    </div>
    <div class="total-row">
      <span class="total-l">Total</span>
      <span class="total-r">$35.00</span>
    </div>
  </div>

  <div class="section-title">Delivery details</div>
  <div class="card">
    <div class="list-item">
      <span class="li-leading">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      </span>
      <div class="li-body">
        <div class="li-headline">Arrives by Apr 14</div>
        <div class="li-support">Send today · One-time payment</div>
      </div>
    </div>
    <div class="list-item">
      <span class="li-leading">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </span>
      <div class="li-body">
        <div class="li-headline">Memo</div>
        <div class="li-support">Invoice #12345678</div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <span class="filled-btn">Submit payment</span>
  </div>
  <div class="text-btn">Edit details</div>
</div>
